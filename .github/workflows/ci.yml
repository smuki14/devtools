name: Java CI

on:
  push:
    branches:
      - master
      - 'feature/**'
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'   # <-- поставь свою версию (17, 21, 25)
          cache: 'gradle'

      - name: Checkstyle
        run: ./gradlew --no-daemon checkstyleMain

      - name: Run tests
        run: ./gradlew --no-daemon test

      - name: Generate JaCoCo report
        run: ./gradlew --no-daemon jacocoTestReport

      - name: Verify JaCoCo coverage
        run: ./gradlew --no-daemon jacocoTestCoverageVerification

      - name: Build
        run: ./gradlew --no-daemon build